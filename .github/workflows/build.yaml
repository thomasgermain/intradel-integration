name: Build

on:
  push:
    branches: [master]
  pull_request:
  # Called by the release workflow, so the release zip is only uploaded after these checks pass.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python of the minimum supported Home Assistant, pinned in requirements_test.txt.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            hacs.json

      # Home Assistant's own pins for the hacs.json minimum: the dependency versions real installs
      # get, and no pip backtracking (about 40s of resolving otherwise).
      - name: Install dependencies
        id: install
        run: |
          constraints="https://raw.githubusercontent.com/home-assistant/core/$(jq -r .homeassistant hacs.json)/homeassistant/package_constraints.txt"
          python -m pip install -r requirements_test.txt -c "$constraints"

      # Each check runs even if a previous one failed, but not when the install itself failed.
      - name: Lint with ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check

      - name: Check formatting with ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check

      - name: Type check with mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest
